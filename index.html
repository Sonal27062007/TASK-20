<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laundry Services</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>

<!-- Navbar -->
<header>
  <h2>Laundry</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">About Us</a>
    <a href="#">Contact</a>
  </nav>
</header>

<!-- Hero Section -->
<section class="hero">
  <div class="hero-text">
    <h1>Revitalize Your Clothes with Expert Laundry Services!</h1>
    <p>Premium quality service at affordable price</p>
    <button onclick="openForm()">Book a Service Today</button>
  </div>

  <div class="hero-img">
    <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" alt="Laundry">
  </div>
</section>

<!-- Stats -->
<section class="stats">
  <div>15+ Laundry Services</div>
  <div>240+ Happy Customers</div>
  <div>2+ Years Experience</div>
</section>

<!-- Booking Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span onclick="closeForm()" class="close">&times;</span>
    <h2>Book Laundry Service</h2>

    <input type="text" id="name" placeholder="Your Name">
    <input type="email" id="email" placeholder="Your Email">
    <button onclick="sendMail()">Book Now</button>
  </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
